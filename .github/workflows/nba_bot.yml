name: Bot NBA Autónomo y Sincronización CSV

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 6:00 UTC (puedes ajustarlo)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Te permite un botón en GitHub para ejecutarlo manualmente cuando quieras

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    
    # 🔑 PERMISO CRUCIAL: Permite que GitHub Actions modifique archivos del repositorio
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Ejecutar el script del Bot
        run: python bot_actualizado.py

      - name: Subir cambios del CSV al repositorio de forma automática
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Verificar si el archivo CSV existe y tiene cambios
          git status
          git add historial_evaluaciones_nba.csv
          
          # Hacer commit y push solo si hay modificaciones (evita errores si no hay cambios)
          git diff --staged --quiet || git commit -m "📊 Actualización automática del historial CSV de la NBA [skip ci]"
          git push
