name: Bot NBA Autónomo y Sincronización CSV

on:
  schedule:
    # Se ejecuta todos los días a las 22:00 UTC (4:00 PM en el Centro de México) para atrapar el Injury Report
    - cron: '0 22 * * *'
  workflow_dispatch: # Mantiene el botón para ejecutarlo manualmente

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scipy streamlit

      - name: Ejecutar el script del Bot (con actualización de Lesiones 4PM)
        run: python bot_actualizado.py

      - name: Sincronizar y subir cambios del CSV al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main --rebase || true
          
          git add historial_evaluaciones_nba.csv "Titulares_NBA_Oficiales_30_Equipos(Puntajes Diarios).csv" alertas_lesiones.json
          
          git diff --staged --quiet || git commit -m "📊 Actualización automática (4:00 PM) - Reporte de lesiones y proyecciones [skip ci]"
          git push origin main
