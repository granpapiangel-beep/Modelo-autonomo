name: Bot Autónomo NBA 24/7

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías necesarias
        run: pip install pandas numpy requests nba_api

      - name: Ejecutar el script del Bot
        run: python bot_actualizado.py
