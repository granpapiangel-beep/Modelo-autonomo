name: Bot NBA Autónomo y Sincronización CSV

on:
  schedule:
    # Cambiado a las 16:00 UTC, que corresponde a las 10:00 AM en el centro de México
    - cron: '0 16 * * *'
  workflow_dispatch: # Mantiene el botón para ejecutarlo manualmente cuando quieras

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scipy

      - name: Ejecutar el script del Bot
        run: python bot_actualizado.py

      - name: Sincronizar y subir cambios del CSV al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Sincronizar con el repositorio remoto por si hubo cambios previos
          git pull origin main --rebase || true
          
          git add historial_evaluaciones_nba.csv
          git diff --staged --quiet || git commit -m "📊 Actualización automática del historial CSV y predicciones de la NBA [skip ci]"
          git push origin main
