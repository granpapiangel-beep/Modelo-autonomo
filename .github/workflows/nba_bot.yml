name: Bot NBA Autónomo y Sincronización CSV

on:
  schedule:
    # 1er Reporte (Mañana): 10:30 AM en el Centro de México (UTC-6 -> 16:30 UTC)
    - cron: '30 16 * * *'
    # 2do Reporte (Tarde): 4:00 PM en el Centro de México (UTC-6 -> 22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch: # Mantiene el botón para ejecutarlo manualmente cuando quieras

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests scipy streamlit

      - name: Ejecutar el script del Bot (Doble ventana de análisis)
        run: python bot_actualizado.py

      - name: Sincronizar y subir cambios al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add historial_evaluaciones_nba.csv "Titulares_NBA_Oficiales_30_Equipos(Puntajes Diarios).csv" alertas_lesiones.json

          if ! git diff --staged --quiet; then
            git commit -m "📊 Sincronización automática (Doble Ventana) - Proyecciones y Lesiones [skip ci]"
            git pull origin main --rebase
            git push origin main
          fi
