name: Bot Autónomo NBA 24/7

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 3:00 AM y 10:00 AM (Hora UTC)
    - cron: '0 3 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch: # Permite ejecutar el bot de forma manual cuando quieras hacer pruebas

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías necesarias
        run: pip install pandas numpy requests

      - name: Ejecutar el script del Bot
        run: python bot_actualizado.py
